              "@type": "Question",
              "name": "Wie lautet die klassische Widmark-Formel und wer war Erik Widmark?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Die Widmark-Formel lautet c = A / (p · r). Sie wurde 1932 vom schwedischen Chemiker und Gerichtsmediziner Erik Matteo Prochet Widmark an der Universität Lund entwickelt. Dabei steht c für die Blutalkoholkonzentration (BAK) in Promille (g/kg), A für die aufgenommene Alkoholmasse in Gramm, p für das Körpergewicht in Kilogramm und r für den Verteilungsfaktor (ca. 0,70 bei Männern und 0,60 bei Frauen)."
              }

              "@type": "Question",
              "name": "Warum wird die Dichte von Ethanol mit 0,8 g/cm³ berechnet?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Reines Ethanol (reiner Alkohol) ist leichter als Wasser und besitzt bei Raumtemperatur (20 °C) eine spezifische Dichte von ca. 0,789 g/cm³. In der Praxis und Forensik wird dieser Wert auf 0,8 g/ml gerundet. Die Formel zur Ermittlung der reinen Alkoholmasse lautet daher: Alkohol in Gramm = Getränkevolumen in Millilitern × (Vol.-% / 100) × 0,8."
              }
            },

              "@type": "Question",
              "name": "Was ist das Resorptionsdefizit und wie beeinflusst Essen den Alkoholspiegel?",
              "acceptedAnswer": {
                "@type": "Answer",

              }
            },

              "@type": "Question",
              "name": "Kann man den Alkoholabbau durch Kaffee, Schlaf, Schwitzen oder Duschen beschleunigen?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nein, das ist ein Mythos. Rund 95 % des Alkohols werden enzymatisch über das Enzym Alkoholdehydrogenase (ADH) in der Leber oxidiert. Dieser Prozess läuft biochemisch mit einer konstanten Rate von ca. 0,10 bis 0,20 Promille pro Stunde ab. Weder Koffein, Kaltwasserduschen noch Schlaf können die Leberenzyme beschleunigen."
              }
            },

              "@type": "Question",
              "name": "Wie viel Promille hat ein 80-kg-Mann nach einem großen Bier (0,5 l, 5,0 Vol.-%)?",

              }
            },

              }
            },
            {
              "@type": "Question",
              "name": "Ab wann droht in Deutschland ein Fahrverbot und ab wann eine MPU?",
              "acceptedAnswer": {

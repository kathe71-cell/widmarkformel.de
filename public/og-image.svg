<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="150" r="300" fill="#F59E0B" opacity="0.06" />
  <circle cx="150" cy="500" r="250" fill="#10B981" opacity="0.04" />
  
  <!-- Outer border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#334155" stroke-width="2" />
  
  <!-- Badge -->
  <rect x="80" y="75" width="460" height="42" rx="21" fill="#FEF3C7" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="102" cy="96" r="6" fill="#F59E0B" />
  <text x="122" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FDE68A" letter-spacing="0.5">WISSENSCHAFTLICHE BAK-BERECHNUNG</text>
  
  <!-- Main Title -->
  <text x="80" y="195" font-family="-apple-system, system-ui, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    Widmark-Formel Rechner
  </text>
  <text x="80" y="260" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#gold)" letter-spacing="-0.5">
    Blutalkohol &amp; Abbauzeit präzise berechnen
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="325" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">
    Modellrechnung nach Erik M. P. Widmark (1932) &amp; Watson-Körperwasser-Modell (TBW).
  </text>
  <text x="80" y="360" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">
    Inklusive stündlicher Abbaukurve &amp; amtlicher deutscher Promillegrenzen (§ 24a StVG, § 316 StGB).
  </text>
  
  <!-- Formula Card Box -->
  <rect x="80" y="415" width="1040" height="135" rx="20" fill="#020617" stroke="#334155" stroke-width="2" />
  <text x="120" y="495" font-family="ui-monospace, monospace" font-size="46" font-weight="900" fill="#F59E0B">c = A / (p · r)</text>
  
  <text x="560" y="470" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">A = Alkoholmasse (g)</text>
  <text x="560" y="505" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">p = Körpergewicht (kg)</text>
  
  <text x="840" y="470" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">r = Reduktionsfaktor (0,70 / 0,60)</text>
  <text x="840" y="505" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">β₆₀ = Abbau ~0,15 ‰ pro Stunde</text>
  
  <!-- Footer Brand -->
  <text x="80" y="585" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="800" fill="#64748B">
    widmarkformel.de
  </text>
  <text x="1120" y="585" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#10B981" text-anchor="end">
    ✓ Geprüfter Stand: 2026
  </text>
</svg>
